# Working profiles for FINALIZER.
#
# Not the meta. The meta (finalizer/meta.py) is the technical boundary; this
# file is taste -- how hard to sit inside it. Edit freely, nothing is compiled in.
#
# `master` renders EVERY profile in this file, one wav each:
#
#   python3 run.py master SRC.wav --out OUT.wav
#     -> OUT_low.wav  OUT_mid.wav  OUT_high.wav
#
# Add a section and it appears in the run; nothing else needs to change.

default = "mid"   # what --no-all-profiles and one-off commands use

# One meta, one name (see README.md). A CLI --meta overrides the profile's.

[low]
# the reference point: no colouring, no automatic notches. Full meta boundary
# + limiter. The contour is free; the report shows how much it moved.
meta = "meta"
crest = 1.0
bass = 1.0
bass_hz = 240.0
deharsh = false

[mid]
# the same one-pass projection toward the speech-shaped contour as [high],
# applied at half strength: pull 0.5. Ceiling, guard, notches and max_eq are
# identical -- only how far the track moves toward the target differs.
meta = "meta"
crest = 1.0
bass = 1.0
bass_hz = 240.0
mid_guard = 4.0
deharsh = true
target = "references/speech_ltass.json"
pull = 0.5
one_shot = true
max_eq = 12.0

[high]
# the full-strength version of [mid]: the contour difference is projected
# toward the speech curve in ONE pass at pull 1.0. The strength knob is max_eq,
# not pull: the difference hits the ceiling at both edges, loudness
# normalisation removes the constant part, and what survives is the part that
# did not reach the ceiling. max_eq 12 gives a +5.8 dB bell, max_eq 9 gives +3.3.
# On dark material this also lifts the air (+13 dB at 10 kHz on dark material).
meta = "meta"
crest = 1.0
bass = 1.0
bass_hz = 240.0
mid_guard = 4.0
deharsh = true
target = "references/speech_ltass.json"
pull = 1.0
one_shot = true
max_eq = 12.0
