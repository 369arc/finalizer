# Working profiles for FINALIZER.
#
# Not the meta. The meta (finalizer/meta.py) is the technical boundary; this
# file is taste -- how hard to sit inside it. Edit freely, nothing is compiled in.
#
# `master` renders EVERY profile in this file, one wav each:
#
#   python3 run.py master SRC.wav --out OUT.wav
#     -> OUT_low.wav  OUT_mid.wav  OUT_high.wav
#
# Add a section and it appears in the run; nothing else needs to change.

default = "mid"   # what --no-all-profiles and one-off commands use

# One meta, one name (see README.md). A CLI --meta overrides the profile's.

[low]
# the reference point: no colouring. Full meta boundary + limiter.
meta = "meta"
crest = 1.0
bass = 1.0
bass_hz = 240.0

[mid]
# the balance chosen by ear: one broad bell, +4.5 dB at 1 kHz, Q 0.4.
# It lifts the 300 Hz-3 kHz zone the ear reads as body and presence, and it
# does so without generating a single harmonic. Fixed shape: same correction
# on any material, no dependence on the track's own curve.
meta = "meta"
crest = 1.0
bass = 1.0
bass_hz = 240.0
mid_guard = 4.0
eq_peak = [1000.0, 4.5, 0.4]

[high]
# the strength knob is max_eq, not pull: the difference is projected toward a
# speech-shaped contour (LTASS) in ONE pass, and whatever reaches the ceiling
# is removed by loudness normalisation -- what survives is the part that did
# not. max_eq 12 gives a +5.8 dB bell, max_eq 9 gives +3.3.
# Unlike [mid] this depends on the track's own contour: on dark material it
# also lifts the air (+13 dB at 10 kHz on dark material).
meta = "meta"
crest = 1.0
bass = 1.0
bass_hz = 240.0
mid_guard = 4.0
target = "references/speech_ltass.json"
pull = 1.0
one_shot = true
max_eq = 12.0
